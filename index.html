        function SalDashboard() {

            const [sals, setSals] = useState(() => {

                } catch (e) { console.error("Errore lettura SAL da LocalStorage", e); }
                return [1];
            }); 

            const [ultimoSalId, setUltimoSalId] = useState(() => {
                try {
                    const saved = localStorage.getItem('gestione-sal-ultimo');
                    return saved ? parseInt(saved, 10) : null;
                } catch { return null; }
            });
            useEffect(() => {
                try {
                    if (ultimoSalId) localStorage.setItem('gestione-sal-ultimo', ultimoSalId);
                    else localStorage.removeItem('gestione-sal-ultimo');
                } catch (e) {
                    alert("Attenzione: Spazio di archiviazione esaurito o errore di salvataggio. I dati potrebbero non essere salvati correttamente.");
                    console.error("LocalStorage error:", e);
                }
            }, [ultimoSalId]);
            
            const [items, setItems] = useState(() => {
                try {
                    const saved = localStorage.getItem('gestione-sal-items');
                    if (saved) return JSON.parse(saved);
                } catch (e) { console.error("Errore lettura Voci da LocalStorage", e); }
                return initialData.map(({ isEditing, ...item }) => ({ ...item, eseguiti: { 1: 0 } }));
            });

            const [cloudConfig, setCloudConfig] = useState(() => {
                try {
                    const saved = localStorage.getItem('sal-cloud-config');
                    if (saved) return JSON.parse(saved);
                } catch(e) {}
                return { binId: '', apiKey: '' };
            });
            const [showCloudSettings, setShowCloudSettings] = useState(false);
            const [isSyncing, setIsSyncing] = useState(false);

            const [editingId, setEditingId] = useState(null);
            const [expandedDescIds, setExpandedDescIds] = useState([]);
            const toggleDescExpand = (id) => {
                setExpandedDescIds(prev => prev.includes(id) ? prev.filter(x => x !== id) : [...prev, id]);
            };
            const [activeSalView, setActiveSalView] = useState("ALL");
            const [searchCodice, setSearchCodice] = useState("");
            const [showOnlyExtra, setShowOnlyExtra] = useState(false);
            const [statusFilter, setStatusFilter] = useState([]); 
            const [hideZero, setHideZero] = useState(false); 
            const [compactView, setCompactView] = useState(() => {
                try { return localStorage.getItem('sal-compact-view') === '1'; } catch { return false; }
            });
            useEffect(() => {
                try { 
                    localStorage.setItem('sal-compact-view', compactView ? '1' : '0'); 
                } catch (e) {
                    alert("Attenzione: Spazio di archiviazione esaurito o errore di salvataggio. I dati potrebbero non essere salvati correttamente.");
                    console.error("LocalStorage error:", e);
                }
            }, [compactView]);
            const [sortConfig, setSortConfig] = useState({ key: null, direction: 'asc' });

            useEffect(() => {
                setHideZero(activeSalView !== "ALL");
            }, [activeSalView]);
            
            const fileInputRef = useRef(null);

            // --- FORMATO DATI SALVATI ---
            // Da ora il salvataggio (backup e Cloud) include anche il flag "Ultimo S.A.L.",
            // che incide sul recupero dell'anticipo. Compatibile all'indietro: i vecchi
            // backup/dati Cloud sono un semplice array di voci e vengono ancora letti.
            const creaPayload = (voci, ultimo) => ({
                formato: 2,
                items: voci !== undefined ? voci : items,
                ultimoSalId: (ultimo !== undefined ? ultimo : ultimoSalId) ?? null,
                exportedAt: new Date().toISOString()
            });
            const leggiPayload = (raw) => Array.isArray(raw)
                ? { items: raw, ultimoSalId: undefined }            // formato vecchio: nessun flag salvato
                : { items: Array.isArray(raw?.items) ? raw.items : null, ultimoSalId: raw?.ultimoSalId ?? null };

            const [lastSavedData, setLastSavedData] = useState(() => JSON.stringify({ items, ultimoSalId }));
            const snapshotDati = useMemo(() => JSON.stringify({ items, ultimoSalId }), [items, ultimoSalId]);
            const hasUnsavedChanges = snapshotDati !== lastSavedData;

            // Ultimo salvataggio riuscito: orario + destinazione (Cloud o file).
            // Conservato sul dispositivo, così resta visibile anche riaprendo l'app.
            const [ultimoSalvataggio, setUltimoSalvataggio] = useState(() => {
                try {
                    const saved = localStorage.getItem('sal-ultimo-salvataggio');
                    if (saved) {
                        const p = JSON.parse(saved);
                        if (p && p.quando) return p;   // { quando: ISO, dove: 'Cloud' | 'file' }
                    }
                } catch (e) {}
                return null;
            });

            // Messaggio temporaneo a comparsa (3,5 s), come showMsg di "Casa in Campagna"
            const [messaggioTemporaneo, setMessaggioTemporaneo] = useState('');
            const timerMsgRef = useRef(null);
            const showMsg = (txt) => {
                setMessaggioTemporaneo(txt);
                if (timerMsgRef.current) clearTimeout(timerMsgRef.current);
                timerMsgRef.current = setTimeout(() => setMessaggioTemporaneo(''), 3500);
            };

            const registraSalvataggio = (dove) => {
                const info = { quando: new Date().toISOString(), dove };
                setUltimoSalvataggio(info);
                try { localStorage.setItem('sal-ultimo-salvataggio', JSON.stringify(info)); } catch (e) {}
            };

            // Testo dell'ultimo salvataggio, formato identico a "Casa in Campagna"
            const testoUltimoSalvataggio = (() => {
                if (!ultimoSalvataggio || !ultimoSalvataggio.quando) return 'Nessun salvataggio su Cloud o file finora';
                const d = new Date(ultimoSalvataggio.quando);
                const oggi = (d.toDateString() === new Date().toDateString());
                return 'Ultimo salvataggio ' + (String(ultimoSalvataggio.dove).toLowerCase() === 'cloud' ? 'sul Cloud' : 'su file')
                     + ': ' + (oggi ? ('oggi alle ' + d.toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' }))
                                    : d.toLocaleString('it-IT'));
            })();

            const latestSal = useMemo(() => {
                return sals.length > 0 ? Math.max(...sals) : 1;
            }, [sals]);

            useEffect(() => {
                const beforeUnloadHandler = (e) => {
                    const needsBackup = snapshotDati !== lastSavedData;
                    if (needsBackup) {
                        e.preventDefault();
                        e.returnValue = "Hai modifiche non salvate! Sei sicuro di voler uscire perdendo i dati?";
                        return "Hai modifiche non salvate! Sei sicuro di voler uscire perdendo i dati?";
                    }
                };
                window.addEventListener('beforeunload', beforeUnloadHandler);
                return () => window.removeEventListener('beforeunload', beforeUnloadHandler);
            }, [snapshotDati, lastSavedData]);

            useEffect(() => {
                try { 
                    localStorage.setItem('gestione-sal-sals', JSON.stringify(sals)); 
                } catch (e) {
                    alert("Attenzione: Spazio di archiviazione esaurito o errore di salvataggio. I dati potrebbero non essere salvati correttamente.");
                    console.error("LocalStorage error:", e);
                }
            }, [sals]);

            useEffect(() => {
                try { 
                    localStorage.setItem('gestione-sal-items', JSON.stringify(items)); 
                } catch (e) {
                    alert("Attenzione: Spazio di archiviazione esaurito o errore di salvataggio. I dati potrebbero non essere salvati correttamente.");
                    console.error("LocalStorage error:", e);
                }
            }, [items]);

            useEffect(() => {
                try {
                    if (cloudConfig.binId !== '' || cloudConfig.apiKey !== '') localStorage.setItem('sal-cloud-config', JSON.stringify(cloudConfig));
                    else localStorage.removeItem('sal-cloud-config');
                } catch (e) {
                    alert("Attenzione: Spazio di archiviazione esaurito o errore di salvataggio. I dati potrebbero non essere salvati correttamente.");
                    console.error("LocalStorage error:", e);
                }
            }, [cloudConfig]);

            useEffect(() => {
                if (cloudConfig.apiKey && cloudConfig.binId) loadFromCloud(true);
            }, []);

            const saveCloudSettings = () => {
                alert("Chiavi di accesso Cloud memorizzate in modo permanente sul dispositivo!\n\nUsa '⬇️ Scarica Dati' per recuperare i dati dal Cloud oppure '⬆️ Salva Ora' per inviare quelli presenti su questo dispositivo.");
            };

            // Traduce il codice di risposta di JSONBin in un messaggio comprensibile
            // Testi identici a "Casa in Campagna"
            const cloudErrore = (status, azione) => {
                switch (status) {
                    case 401:
                    case 403: return "Chiave API (Master Key) errata o non autorizzata.\nControlla la chiave in \u00ab Configura Cloud \u00bb.";
                    case 404: return "Bin ID inesistente: nessun contenitore trovato con questo identificativo.\nControlla il Bin ID in \u00ab Configura Cloud \u00bb.";
                    case 429: return "Limite di richieste JSONBin esaurito.\nAttendi qualche minuto e riprova.";
                    case 400: return "Richiesta non valida (dati o identificativo non corretti).";
                    default:
                        if (!status) return "Nessuna connessione a internet, oppure il servizio non risponde.";
                        return "Errore del servizio Cloud durante " + azione + " (codice " + status + ").";
                }
            };

            const loadFromCloud = async (isSilent = false) => {
                if (!cloudConfig.apiKey || !cloudConfig.binId) {
                    if (!isSilent) alert("Inserisci Bin ID e Chiave di Accesso prima di sincronizzare!"); 
                    return;
                }
                setIsSyncing(true);
                try {
                    const response = await fetch(`https://api.jsonbin.io/v3/b/${cloudConfig.binId}/latest`, {
                        headers: { 'X-Master-Key': cloudConfig.apiKey }
                    });
                    if (!response.ok) throw new Error(cloudErrore(response.status, 'il caricamento'));
                    const result = await response.json();
                    const { items: restoredData, ultimoSalId: ultimoDalCloud } = leggiPayload(result.record);
                    if (Array.isArray(restoredData)) {
                        let maxSalFound = 1;
                        const upgradedData = restoredData.map(item => {
                            let eseguiti = item.eseguiti || {};
                            Object.keys(eseguiti).forEach(k => {
                                if (k !== 'EXTRA' && k !== 'PRE' && Number(k) > maxSalFound) maxSalFound = Number(k);
                            });
                            const { isEditing, ...cleanItem } = item;
                            return { ...cleanItem, eseguiti };
                        });

                        // Se il Cloud è in formato vecchio (senza flag) si mantiene quello locale
                        const nuovoUltimo = ultimoDalCloud !== undefined ? ultimoDalCloud : ultimoSalId;

                        if (isSilent) {
                            const cloudString = JSON.stringify({ items: upgradedData, ultimoSalId: nuovoUltimo });
                            const localString = JSON.stringify({ items, ultimoSalId });
                            if (cloudString !== localString) {
                                const usaCloud = window.confirm(
                                    "☁️ ATTENZIONE: su questo dispositivo sono presenti dati diversi da quelli salvati sul Cloud.\n\n" +
                                    "• OK = scarica la versione Cloud (le modifiche locali andranno perse)\n" +
                                    "• Annulla = mantieni i dati di questo dispositivo"
                                );
                                if (!usaCloud) return; 
                            }
                        }

                        setSals(Array.from({length: maxSalFound}, (_, i) => i + 1));
                        setItems(upgradedData);
                        setUltimoSalId(nuovoUltimo);
                        setActiveSalView("ALL");
                        setEditingId(null);
                        setLastSavedData(JSON.stringify({ items: upgradedData, ultimoSalId: nuovoUltimo }));
                        if (!isSilent) { alert("Dati scaricati dal Cloud con successo!"); setShowCloudSettings(false); }
                    }
                } catch (error) {
                    if (!isSilent) alert("⚠️ Caricamento dal Cloud non riuscito\n\n" + error.message);
                } finally { setIsSyncing(false); }
            };

            // Riferimento temporale dei dati sul Cloud (per il controllo anti-sovrascrittura)
            const cloudBaseExportedAtRef = useRef(null);

            const saveToCloud = async (dataToSave, isExit = false) => {
                if (!cloudConfig.apiKey || !cloudConfig.binId) {
                    if (!isExit) alert("Configura prima il Bin ID e l'API Key.");
                    return false;
                }
                setIsSyncing(true);
                try {
                    // Controllo anti-sovrascrittura: se sul Cloud ci sono dati più recenti, chiede conferma
                    try {
                        const chk = await fetch(`https://api.jsonbin.io/v3/b/${cloudConfig.binId}/latest`, {
                            method: 'GET', headers: { 'X-Master-Key': cloudConfig.apiKey }
                        });
                        if (chk.ok) {
                            const chkData = await chk.json();
                            const remoteAt = (chkData.record && chkData.record.exportedAt) ? new Date(chkData.record.exportedAt).getTime() : 0;
                            if (remoteAt && cloudBaseExportedAtRef.current && remoteAt > cloudBaseExportedAtRef.current + 1000) {
                                if (!window.confirm("⚠️ Sul cloud ci sono dati più recenti, salvati da un altro dispositivo.\n\nSe continui verranno SOVRASCRITTI con i dati di questo dispositivo. Procedere?")) {
                                    setIsSyncing(false);
                                    return false;
                                }
                            }
                        }
                    } catch (chkErr) { /* se il controllo fallisce si prosegue comunque col salvataggio */ }

                    const res = await fetch(`https://api.jsonbin.io/v3/b/${cloudConfig.binId}`, {
                        method: 'PUT',
                        headers: { 'X-Master-Key': cloudConfig.apiKey, 'Content-Type': 'application/json' },
                        body: JSON.stringify(dataToSave)
                    });
                    if (!res.ok) throw new Error(cloudErrore(res.status, 'il salvataggio'));

                    cloudBaseExportedAtRef.current = (dataToSave && dataToSave.exportedAt) ? new Date(dataToSave.exportedAt).getTime() : Date.now();
                    setLastSavedData(JSON.stringify({ items: dataToSave.items, ultimoSalId: dataToSave.ultimoSalId }));
                    registraSalvataggio('cloud');

                    if (isExit) {
                        alert("✅ Salvataggio completato. I dati sono al sicuro. Puoi chiudere manualmente questa scheda (il browser potrebbe bloccare la chiusura automatica).");
                        try { window.close(); } catch(e) {}
                    } else {
                        showMsg('☁️ Salvataggio in Cloud completato!');
                    }
                    return true;
                } catch (e) {
                    alert("⚠️ Salvataggio sul Cloud non riuscito\n\n" + e.message + "\n\nI dati restano salvati su questo dispositivo.");
                    return false;
                } finally { setIsSyncing(false); }
            };

            // Salva ora: Cloud se configurato, altrimenti backup su file (come saveNow di Casa in Campagna)
            const saveNow = () => {
                if (cloudConfig.binId && cloudConfig.apiKey) saveToCloud(creaPayload(), false);
                else handleBackup(false);
            };

            const handleSaveAndExit = async () => {
                const currentDataString = snapshotDati;
                if (currentDataString !== lastSavedData) {
                    if (cloudConfig.apiKey && cloudConfig.binId) { await saveToCloud(creaPayload(), true); return; }
                    const now = new Date();
                    const fileName = `gestionesal_${now.toISOString().split('T')[0]}.json`;
                    const dataToSave = JSON.stringify(creaPayload(), null, 2);
                    try {
                        if (window.showSaveFilePicker) {
                            const fileHandle = await window.showSaveFilePicker({ suggestedName: fileName, types: [{ description: 'JSON', accept: { 'application/json': ['.json'] } }]});
                            const writable = await fileHandle.createWritable();
                            await writable.write(dataToSave);
                            await writable.close();
                        } else {
                            const blob = new Blob([dataToSave], { type: 'application/json' });
                            const url = URL.createObjectURL(blob);
                            const link = document.createElement('a'); link.href = url; link.download = fileName;
                            document.body.appendChild(link); link.click(); document.body.removeChild(link);
                        }
                        setLastSavedData(currentDataString);
                        registraSalvataggio('file');
                        alert("✅ Backup locale completato. Il file è stato scaricato. Puoi chiudere manualmente questa scheda (il browser potrebbe bloccare la chiusura automatica).");
                        try { window.close(); } catch(e) {}
                    } catch (error) { if (error.name !== 'AbortError') alert("Errore durante il salvataggio locale."); }
                } else {
                    alert("Nessuna modifica. Puoi chiudere manualmente questa scheda.");
                    try { window.close(); } catch(e) {}
                }
            };

            const isExtraItem = (codice) => codice && String(codice).toUpperCase().startsWith('EXTRA');
            const isPreItem = (codice) => codice && String(codice).toUpperCase().startsWith('PRE-');

            const getItemTotalEseguito = (item) => {
                return Object.values(item.eseguiti || {}).reduce((sum, val) => sum + (parseFloat(val) || 0), 0);
            };

            const getItemStatus = (item) => {
                if (isPreItem(item.codice)) return 'pre';
                if (isExtraItem(item.codice)) return 'extra';
                const prev = parseFloat(item.importoPrevisto) || 0;
                const eseg = getItemTotalEseguito(item);
                if (prev > 0 && eseg >= prev - 0.005) return 'done';
                if (eseg > 0) return 'doing';
                return 'todo';
            };

            const getProgressStatus = (item) => {
                const prev = parseFloat(item.importoPrevisto) || 0;
                const eseg = getItemTotalEseguito(item);
                if (prev > 0 && eseg >= prev - 0.005) return 'done';
                if (eseg > 0) return 'doing';
                return 'todo';
            };

            const statusCounts = useMemo(() => {
                const baseList = mainTab === 'PRE_COSTRUZIONE' 
                    ? items.filter(item => isPreItem(item.codice))
                    : (activeSalView !== "ALL" ? items.filter(item => !isExtraItem(item.codice) && !isPreItem(item.codice)) : items.filter(item => !isPreItem(item.codice)));
                
                const c = { all: baseList.length, todo: 0, doing: 0, done: 0, extra: 0, pre: 0 };
                items.forEach(item => {
                    if (mainTab === 'PRE_COSTRUZIONE') {
                        if (isPreItem(item.codice)) {
                            c.pre++;
                            c[getProgressStatus(item)]++; 
                        }
                    } else if (mainTab === 'CANTIERE') {
                        const s = getItemStatus(item);
                        if (s === 'extra') c.extra++;
                        else if (s !== 'pre' && (activeSalView === "ALL" || !showOnlyExtra)) c[s]++;
                    }
                });
                return c;
            }, [items, activeSalView, showOnlyExtra, mainTab]);

            const totals = useMemo(() => {
                const previstoBase = items.filter(i => !isExtraItem(i.codice) && !isPreItem(i.codice)).reduce((sum, item) => sum + (parseFloat(item.importoPrevisto) || 0), 0);
                const previstoExtra = items.filter(i => isExtraItem(i.codice)).reduce((sum, item) => sum + (parseFloat(item.importoPrevisto) || 0), 0);
                const previstoCantiere = previstoBase + previstoExtra;
                
                let eseguitoBase = 0; let eseguitoExtra = 0;
                if (activeSalView === "ALL") {
                    eseguitoBase = items.filter(i => !isExtraItem(i.codice) && !isPreItem(i.codice)).reduce((sum, item) => sum + getItemTotalEseguito(item), 0);
                    eseguitoExtra = items.filter(i => isExtraItem(i.codice)).reduce((sum, item) => sum + getItemTotalEseguito(item), 0);
                } else {
                    eseguitoBase = items.filter(i => !isExtraItem(i.codice) && !isPreItem(i.codice)).reduce((sum, item) => sum + (parseFloat(item.eseguiti?.[activeSalView]) || 0), 0);
                }

                const ANTICIPO_IMPONIBILE = 5000;
                const RECUPERO_RATA = ANTICIPO_IMPONIBILE / 2;

                const eseguitoCantiereTot = eseguitoBase + eseguitoExtra;
                const scontoEseguito = eseguitoBase * 0.07;
                const nettoBase = eseguitoBase - scontoEseguito;

                let recuperoAnticipo = 0;
                if (activeSalView === "ALL") {
                    if (sals.includes(1)) recuperoAnticipo += RECUPERO_RATA;
                    if (ultimoSalId && sals.includes(ultimoSalId)) recuperoAnticipo += RECUPERO_RATA;
                } else {
                    if (activeSalView === 1) recuperoAnticipo += RECUPERO_RATA;
                    if (activeSalView === ultimoSalId) recuperoAnticipo += RECUPERO_RATA;
                }

                const imponibileBase = nettoBase - recuperoAnticipo;
                const ivaBase = imponibileBase > 0 ? imponibileBase * 0.10 : 0;
                const totaleIvatoBase = imponibileBase + ivaBase;

                const totaleGeneraleDaPagare = totaleIvatoBase + eseguitoExtra;

                const percentualeRealeCantiere = previstoBase > 0 ? ((eseguitoBase / previstoBase) * 100) : 0;
                const percentualeClampataCantiere = Math.min(percentualeRealeCantiere, 100).toFixed(2);
                
                const previstoPre = items.filter(i => isPreItem(i.codice)).reduce((sum, item) => sum + (parseFloat(item.importoPrevisto) || 0), 0);
                const eseguitoPre = items.filter(i => isPreItem(i.codice)).reduce((sum, item) => sum + getItemTotalEseguito(item), 0);
                const percentualeRealePre = previstoPre > 0 ? ((eseguitoPre / previstoPre) * 100) : 0;
                const percentualeClampataPre = Math.min(percentualeRealePre, 100).toFixed(2);

                return { 
                    previstoBase, previstoExtra, previstoCantiere, 
                    eseguitoBase, eseguitoExtra, eseguitoCantiereTot, 
                    scontoEseguito, nettoBase, recuperoAnticipo, imponibileBase, ivaBase, totaleIvatoBase, totaleGeneraleDaPagare,
                    percentuale: percentualeClampataCantiere, percentualeReale: percentualeRealeCantiere,
                    previstoPre, eseguitoPre, percentualePre: percentualeClampataPre, percentualeRealePre
                };
            }, [items, activeSalView, sals, ultimoSalId]);

            const globalTotals = useMemo(() => {
                let base = { previsto: 0, eseguito: 0, io: 0, silvia: 0, nd: 0 };
                let extra = { previsto: 0, eseguito: 0, io: 0, silvia: 0, nd: 0 };
                let pre = { previsto: 0, eseguito: 0, io: 0, silvia: 0, nd: 0 };

                items.forEach(item => {
                    const prev = parseFloat(item.importoPrevisto) || 0;
                    const eseg = getItemTotalEseguito(item);
                    const pagato = item.pagatoDa;

                    let target = base;
                    if (isPreItem(item.codice)) target = pre;
                    else if (isExtraItem(item.codice)) target = extra;

                    target.previsto += prev;
                    target.eseguito += eseg;

                    if (pagato === 'Io') target.io += eseg;
                    else if (pagato === 'Silvia') target.silvia += eseg;
                    else target.nd += eseg;
                });

                const ANTICIPO_IMPONIBILE = 5000;
                const RECUPERO_RATA = ANTICIPO_IMPONIBILE / 2;

                const totaleSconto = base.eseguito * 0.07;
                const baseNetto = base.eseguito - totaleSconto;

                let anticipoRecuperato = 0;
                if (sals.includes(1)) anticipoRecuperato += RECUPERO_RATA;
                if (ultimoSalId && sals.includes(ultimoSalId)) anticipoRecuperato += RECUPERO_RATA;

                const imponibileBase = baseNetto - anticipoRecuperato;
                const ivaBase = imponibileBase > 0 ? imponibileBase * 0.10 : 0;
                const totaleIvatoBase = imponibileBase + ivaBase;

                const anticipoGiaPagatoIvato = ANTICIPO_IMPONIBILE * 1.10; // 5500
                const totaleSpesaCantiereBase = totaleIvatoBase + anticipoGiaPagatoIvato;

                const fractionIo = base.eseguito > 0 ? (base.io / base.eseguito) : 0;
                const fractionSilvia = base.eseguito > 0 ? (base.silvia / base.eseguito) : 0;
                const fractionNd = base.eseguito > 0 ? (base.nd / base.eseguito) : 0;

                const baseEffettivo = {
                    io: anticipoGiaPagatoIvato + (totaleIvatoBase * fractionIo),
                    silvia: (totaleIvatoBase * fractionSilvia),
                    nd: (totaleIvatoBase * fractionNd),
                    eseguito: totaleSpesaCantiereBase
                };

                const totaleGeneraleLordoAssegnato = base.eseguito + extra.eseguito + pre.eseguito; 
                const totaleUsciteFinanziarie = totaleSpesaCantiereBase + extra.eseguito + pre.eseguito;

                return { 
                    base, extra, pre, baseEffettivo,
                    totaleSconto, baseNetto, anticipoRecuperato, imponibileBase, ivaBase, totaleIvatoBase, anticipoGiaPagatoIvato, totaleSpesaCantiereBase,
                    totaleGeneraleLordoAssegnato, totaleUsciteFinanziarie 
                };
            }, [items, sals, ultimoSalId]);

            const paymentTotals = useMemo(() => {
                if (mainTab === 'PRE_COSTRUZIONE') {
                    let io = 0; let silvia = 0; let nonAssegnato = 0;
                    items.filter(i => isPreItem(i.codice)).forEach(item => {
                        const amount = getItemTotalEseguito(item);
                        if (item.pagatoDa === 'Io') io += amount;
                        else if (item.pagatoDa === 'Silvia') silvia += amount;
                        else nonAssegnato += amount;
                    });
                    return { io, silvia, nonAssegnato };
                }

                let rawBaseIo = 0, rawBaseSilvia = 0, rawBaseNd = 0, rawBaseTot = 0;
                let rawExtraIo = 0, rawExtraSilvia = 0, rawExtraNd = 0;

                items.filter(i => !isPreItem(i.codice)).forEach(item => {
                    const amount = activeSalView === "ALL" 
                        ? getItemTotalEseguito(item) 
                        : (parseFloat(item.eseguiti?.[activeSalView]) || 0);

                    if (isExtraItem(item.codice)) {
                        if (activeSalView === "ALL") {
                            if (item.pagatoDa === 'Io') rawExtraIo += amount;
                            else if (item.pagatoDa === 'Silvia') rawExtraSilvia += amount;
                            else rawExtraNd += amount;
                        }
                    } else {
                        rawBaseTot += amount;
                        if (item.pagatoDa === 'Io') rawBaseIo += amount;
                        else if (item.pagatoDa === 'Silvia') rawBaseSilvia += amount;
                        else rawBaseNd += amount;
                    }
                });

                const fractionIo = rawBaseTot > 0 ? (rawBaseIo / rawBaseTot) : 0;
                const fractionSilvia = rawBaseTot > 0 ? (rawBaseSilvia / rawBaseTot) : 0;
                const fractionNd = rawBaseTot > 0 ? (rawBaseNd / rawBaseTot) : 0;

                const RECUPERO_RATA_IVATA = 2500 * 1.10; // 2750
                let anticipoIvato = 0;
                
                if (activeSalView === "ALL") {
                    if (sals.includes(1)) anticipoIvato += RECUPERO_RATA_IVATA;
                    if (ultimoSalId && sals.includes(ultimoSalId)) anticipoIvato += RECUPERO_RATA_IVATA;
                } else {
                    if (activeSalView === 1) anticipoIvato += RECUPERO_RATA_IVATA;
                    if (ultimoSalId && activeSalView === ultimoSalId) anticipoIvato += RECUPERO_RATA_IVATA;
                }

                const baseIvato = totals.totaleIvatoBase || 0;

                const io = anticipoIvato + (baseIvato * fractionIo) + rawExtraIo;
                const silvia = (baseIvato * fractionSilvia) + rawExtraSilvia;
                const nonAssegnato = (baseIvato * fractionNd) + rawExtraNd;

                return { io, silvia, nonAssegnato };
            }, [items, activeSalView, mainTab, totals.totaleIvatoBase, sals, ultimoSalId]);

            const filteredItems = useMemo(() => {
                let result = [...items];
                
                if (mainTab === 'PRE_COSTRUZIONE') {
                    result = result.filter(item => isPreItem(item.codice));
                } else if (mainTab === 'CANTIERE') {
                    result = result.filter(item => !isPreItem(item.codice));
                    if (activeSalView !== "ALL") {
                        result = result.filter(item => !isExtraItem(item.codice));
                    } else if (showOnlyExtra) {
                        result = result.filter(item => isExtraItem(item.codice));
                    }
                }

                if (statusFilter.length > 0) {
                    result = result.filter(item => {
                        return statusFilter.some(f => {
                            if (f === 'extra') return isExtraItem(item.codice);
                            return getProgressStatus(item) === f;
                        });
                    });
                }

                if (hideZero) {
                    result = result.filter(item => {
                        if (isPreItem(item.codice)) return (parseFloat(item.eseguiti?.['PRE']) || 0) > 0;
                        const eseg = activeSalView === "ALL" ? getItemTotalEseguito(item) : (parseFloat(item.eseguiti?.[activeSalView]) || 0);
                        return eseg > 0;
                    });
                }
                
                if (searchCodice.trim()) {
                    const searchLower = searchCodice.toLowerCase();
                    result = result.filter(item => 
                        (item.codice || "").toLowerCase().includes(searchLower) ||
                        (item.descrizione || "").toLowerCase().includes(searchLower)
                    );
                }

                if (sortConfig.key) {
                    result.sort((a, b) => {
                        if (sortConfig.key === 'codice') {
                            const codA = String(a.codice || "").toLowerCase();
                            const codB = String(b.codice || "").toLowerCase();
                            if (codA < codB) return sortConfig.direction === 'asc' ? -1 : 1;
                            if (codA > codB) return sortConfig.direction === 'asc' ? 1 : -1;
                            return 0;
                        }
                        if (sortConfig.key === 'importoPrevisto') {
                            const valA = parseFloat(a.importoPrevisto) || 0;
                            const valB = parseFloat(b.importoPrevisto) || 0;
                            return sortConfig.direction === 'asc' ? valA - valB : valB - valA;
                        }
                        if (sortConfig.key === 'percentuale') {
                            const getPerc = (item) => {
                                const prev = parseFloat(item.importoPrevisto) || 0;
                                if (prev === 0) return 0;
                                return (getItemTotalEseguito(item) / prev) * 100;
                            };
                            return sortConfig.direction === 'asc' ? getPerc(a) - getPerc(b) : getPerc(b) - getPerc(a);
                        }
                        if (sortConfig.key === 'realizzato') {
                            const getEseguito = (item) => activeSalView === "ALL" ? getItemTotalEseguito(item) : (parseFloat(item.eseguiti?.[activeSalView]) || 0);
                            const valA = getEseguito(a); const valB = getEseguito(b);
                            return sortConfig.direction === 'asc' ? valA - valB : valB - valA;
                        }
                        if (sortConfig.key === 'daRealizzare') {
                            const getDaRealizzare = (item) => {
                                const prev = parseFloat(item.importoPrevisto) || 0;
                                const eseg = activeSalView === "ALL" ? getItemTotalEseguito(item) : (parseFloat(item.eseguiti?.[activeSalView]) || 0);
                                return prev - eseg;
                            };
                            const valA = getDaRealizzare(a); const valB = getDaRealizzare(b);
                            return sortConfig.direction === 'asc' ? valA - valB : valB - valA;
                        }
                        return 0;
                    });
                }
                
                return result;
            }, [items, searchCodice, showOnlyExtra, statusFilter, hideZero, sortConfig, activeSalView, mainTab]);

            const handleItemChange = (id, field, value) => {
                setItems(items.map(item => item.id === id ? { ...item, [field]: value } : item));
            };

            const handleSalChange = (id, salId, value) => {
                setItems(items.map(item => item.id === id ? { ...item, eseguiti: { ...item.eseguiti, [salId]: value } } : item));
            };

            const handleTotalChange = (id, value) => {
                if (String(value).trim() === '') return;
                setItems(items.map(item => {
                    if (item.id === id) {
                        let parsedValue = parseFloat(value) || 0;
                        if (isPreItem(item.codice)) return { ...item, eseguiti: { 'PRE': parsedValue.toString() } };
                        if (isExtraItem(item.codice)) return { ...item, eseguiti: { 'EXTRA': parsedValue.toString() } };
                        
                        const previousSalsTotal = Object.entries(item.eseguiti || {}).reduce((sum, [key, val]) => {
                            return Number(key) === latestSal ? sum : sum + (parseFloat(val) || 0);
                        }, 0);

                        if (parsedValue < previousSalsTotal) {
                            alert(`Attenzione: importo inferiore ai SAL precedenti (${formatCurrency(previousSalsTotal)}). Annullato.`);
                            return item;
                        }
                        return { ...item, eseguiti: { ...item.eseguiti, [latestSal]: (parsedValue - previousSalsTotal).toString() } };
                    }
                    return item;
                }));
            };

            const createNewSal = () => {
                const nextSalNumber = latestSal + 1;
                if (!window.confirm(`Creare SAL n° ${nextSalNumber}?`)) return;
                setSals([...sals, nextSalNumber]);
                setActiveSalView(nextSalNumber);
                setItems(items.map(item => ({ ...item, eseguiti: { ...item.eseguiti, [nextSalNumber]: 0 } })));
            };

            const deleteLastSal = () => {
                if (sals.length <= 1) { alert("Impossibile eliminare l'unico SAL."); return; }
                const hasData = items.some(item => parseFloat(item.eseguiti?.[latestSal]) > 0);
                if (hasData && !window.confirm(`⚠️ ATTENZIONE: Il SAL ${latestSal} contiene importi. Eliminarlo?`)) return;
                if (!hasData && !window.confirm(`Eliminare il SAL ${latestSal}?`)) return;
                
                const newSals = sals.filter(s => s !== latestSal);
                setSals(newSals);
                if (ultimoSalId === latestSal) setUltimoSalId(null);
                if (activeSalView === latestSal) setActiveSalView("ALL");
                setItems(items.map(item => {
                    const newEseguiti = { ...item.eseguiti };
                    delete newEseguiti[latestSal];
                    return { ...item, eseguiti: newEseguiti };
                }));
            };

            const toggleEdit = (id) => setEditingId(prev => prev === id ? null : id);
            const deleteItem = (id) => {
                if(window.confirm("Eliminare questa voce?")) {
                    setItems(items.filter(item => item.id !== id));
                    if (editingId === id) setEditingId(null);
                }
            };

            const addItem = () => {
                const newId = items.length > 0 ? Math.max(...items.map(i => i.id)) + 1 : 1;
                setItems([...items, {
                    id: newId, codice: "", descrizione: "", importoPrevisto: "", note: "", pagatoDa: "",
                    eseguiti: sals.reduce((acc, sal) => ({ ...acc, [sal]: 0 }), {})
                }]);
                setSearchCodice(""); setShowOnlyExtra(false); setEditingId(newId);
                setTimeout(() => window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' }), 100);
            };

            const addExtraItem = () => {
                const newId = items.length > 0 ? Math.max(...items.map(i => i.id)) + 1 : 1;
                let maxNum = 0;
                items.filter(i => isExtraItem(i.codice)).forEach(i => {
                    const numPart = parseInt(i.codice.split('-')[1]);
                    if (!isNaN(numPart) && numPart > maxNum) maxNum = numPart;
                });
                setItems([...items, {
                    id: newId, codice: `EXTRA-${String(maxNum + 1).padStart(3, '0')}`, descrizione: "", importoPrevisto: "", note: "", pagatoDa: "", eseguiti: { 'EXTRA': 0 }
                }]);
                setSearchCodice(""); setShowOnlyExtra(true); setActiveSalView("ALL"); setEditingId(newId);
                setTimeout(() => window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' }), 100);
            };

            const addPreItem = () => {
                const newId = items.length > 0 ? Math.max(...items.map(i => i.id)) + 1 : 1;
                let maxNum = 0;
                items.filter(i => isPreItem(i.codice)).forEach(i => {
                    const numPart = parseInt(i.codice.split('-')[1]);
                    if (!isNaN(numPart) && numPart > maxNum) maxNum = numPart;
                });
                setItems([...items, {
                    id: newId, codice: `PRE-${String(maxNum + 1).padStart(3, '0')}`, descrizione: "", importoPrevisto: "", note: "", pagatoDa: "", eseguiti: { 'PRE': 0 }
                }]);
                setSearchCodice(""); setEditingId(newId);
                setTimeout(() => window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' }), 100);
            };

            const handleBackup = (isExit = false) => {
                const dataToSave = JSON.stringify(creaPayload(), null, 2);
                const blob = new Blob([dataToSave], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a'); link.href = url;
                link.download = `backup_sal_${new Date().toISOString().split('T')[0]}.json`;
                document.body.appendChild(link); link.click(); document.body.removeChild(link);
                URL.revokeObjectURL(url);
                setLastSavedData(snapshotDati);
                registraSalvataggio('file');
                if (isExit) {
                    alert("✅ Backup locale completato. Il file è stato scaricato. Puoi chiudere manualmente questa scheda (il browser potrebbe bloccare la chiusura automatica).");
                    try { window.close(); } catch(e) {}
                } else {
                    showMsg('✅ Backup scaricato!');
                }
            };

            const handleExportCSV = () => {
                const sep = ';'; const esc = (v) => `"${String(v ?? '').replace(/"/g, '""')}"`;
                const num = (v) => (parseFloat(v) || 0).toFixed(2).replace('.', ',');
                const intestazione = ['Codice', 'Descrizione', 'Importo Previsto', 'Eseguito', 'Residuo', 'Avanzamento %', 'Pagato da', 'Note'];
                const righe = filteredItems.map(item => {
                    const prev = parseFloat(item.importoPrevisto) || 0;
                    const eseg = (isPreItem(item.codice) || activeSalView === "ALL") ? getItemTotalEseguito(item) : (parseFloat(item.eseguiti?.[activeSalView]) || 0);
                    const perc = prev > 0 ? Math.round((eseg / prev) * 100) : 0;
                    return [item.codice, item.descrizione, num(prev), num(eseg), num(prev - eseg), perc, item.pagatoDa || '', item.note || ''].map(esc).join(sep);
                });

                let riepilogo = [];
                const vuota = Array(intestazione.length).fill('""').join(sep);
                if (mainTab === 'CANTIERE') {
                    riepilogo = [ vuota, [esc('RIEPILOGO CANTIERE (IVA ESPOSTA)'), '', '', '', '', '', '', ''].join(sep),

                        [esc('Imponibile Soggetto a IVA'), '', '', esc(num(totals.imponibileBase)), '', '', '', ''].join(sep),
                        [esc('IVA 10%'), '', '', esc('+' + num(totals.ivaBase)), '', '', '', ''].join(sep),
                        [esc('Totale Ivato Base'), '', '', esc(num(totals.totaleIvatoBase)), '', '', '', ''].join(sep),
                        [esc('Totale Extra (IVA Inclusa)'), '', esc(num(totals.previstoExtra)), esc(num(totals.eseguitoExtra)), '', '', '', ''].join(sep),
                        [esc('TOTALE FATTURA DA PAGARE'), '', '', esc(num(totals.totaleGeneraleDaPagare)), '', '', '', ''].join(sep),
                    ];
                } else {
                    riepilogo = [ vuota, [esc('RIEPILOGO PRE-COSTRUZIONE'), '', '', '', '', '', '', ''].join(sep),
                        [esc('Totale Progettazione'), '', esc(num(totals.previstoPre)), esc(num(totals.eseguitoPre)), '', '', '', ''].join(sep)
                    ];
                }

                const csv = '\uFEFF' + [intestazione.map(esc).join(sep), ...righe, ...riepilogo].join('\r\n'); 
                const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = `sal_${mainTab.toLowerCase()}_${new Date().toISOString().split('T')[0]}.csv`;
                document.body.appendChild(link); link.click(); document.body.removeChild(link);
                URL.revokeObjectURL(url);
            };

            const handlePrint = () => {

                let tableTotali = '';

                        <tr><td class="lbl" style="color:#2563eb;">IVA 10%</td><td class="val" style="color:#2563eb;">+ ${fmt(totals.ivaBase)}</td></tr>
                        <tr><td class="lbl font-bold" style="color:#1e40af;">TOTALE SAL (IVA INCLUSA)</td><td class="val font-bold" style="color:#1e40af;">${fmt(totals.totaleIvatoBase)}</td></tr>
                        ${(totals.eseguitoExtra > 0) ? `<tr><td class="lbl">Spese Extra (IVA Inclusa)</td><td class="val">+ ${fmt(totals.eseguitoExtra)}</td></tr>` : ''}
                        <tr class="netto"><td>TOTALE FATTURA / DA PAGARE</td><td class="val">${fmt(totals.totaleGeneraleDaPagare)}</td></tr>`;
                } else {
                    tableTotali = `<tr class="netto"><td>TOTALE SPESE PRELIMINARI</td><td class="val">${fmt(totals.eseguitoPre)}</td></tr>`;
                }

                const html = `<!DOCTYPE html><html lang="it"><head><meta charset="utf-8"><title>${titolo} - ${dataOggi}</title>
                <style> * { box-sizing: border-box; } body { font-family: Arial, Helvetica, sans-serif; color: #1f2937; margin: 24px; font-size: 12px; } h1 { font-size: 18px; margin: 0 0 2px; } .sub { color: #6b7280; font-size: 12px; margin-bottom: 16px; } table { width: 100%; border-collapse: collapse; margin-bottom: 20px; } th, td { border: 1px solid #d1d5db; padding: 5px 7px; text-align: left; vertical-align: top; } th { background: #f3f4f6; font-size: 11px; text-transform: uppercase; letter-spacing: .03em; } td.r, th.r { text-align: right; white-space: nowrap; } td.c, th.c { text-align: center; } td.mono { font-family: monospace; white-space: nowrap; } .tot { width: 340px; margin-left: auto; } .tot td { border: none; padding: 3px 6px; } .tot .lbl { color: #6b7280; } .tot .val { text-align: right; font-weight: bold; } .tot .sconto { color: #dc2626; } .tot .netto td { border-top: 2px solid #1e40af; color: #1e40af; font-size: 14px; padding-top: 6px; } .foot { margin-top: 30px; color: #9ca3af; font-size: 10px; text-align: center; } @media print { body { margin: 12mm; } } </style></head><body>
                    <h1>Dashboard S.A.L. — ${titolo}</h1>

                    <table class="tot"><tbody>${tableTotali}</tbody></table>
                </body></html>`;

                const w = window.open('', '_blank');
                if (!w) { alert("Sblocca i popup."); return; }
                w.document.write(html); w.document.close(); w.focus();
                setTimeout(() => { w.print(); }, 300);
            };

            const handleRestore = (event) => {
                const file = event.target.files[0];
                if (file) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                    const { items: restoredData, ultimoSalId: ultimoDalFile } = leggiPayload(JSON.parse(e.target.result));
                    if (Array.isArray(restoredData)) {

                        const upgradedData = restoredData.map(item => {
                        let eseguiti = item.eseguiti || {};

                        Object.keys(eseguiti).forEach(k => {
                            if (k !== 'EXTRA' && k !== 'PRE' && Number(k) > maxSalFound) maxSalFound = Number(k);
                        });
                        const { isEditing, ...cleanItem } = item;
                        return { ...cleanItem, eseguiti };
                        });
                        // Backup in formato vecchio (senza flag): si mantiene quello locale
                        const nuovoUltimo = ultimoDalFile !== undefined ? ultimoDalFile : ultimoSalId;
                        setSals(Array.from({length: maxSalFound}, (_, i) => i + 1));
                        setItems(upgradedData); setUltimoSalId(nuovoUltimo); setActiveSalView("ALL"); setEditingId(null);

                        alert("Dati ripristinati con successo!");
                    }

                }; reader.readAsText(file);

                                <div><label className="block text-sm font-semibold text-gray-700 mb-1">API Key</label><input type="password" value={cloudConfig.apiKey} onChange={e => setCloudConfig({...cloudConfig, apiKey: e.target.value.trim()})} className="w-full border border-gray-300 rounded-lg p-2.5 text-sm" placeholder="$2a$10$..." /></div>
                                <div className="pt-2"><button onClick={saveCloudSettings} className="w-full bg-gray-800 text-white py-2.5 rounded-lg font-semibold hover:bg-black transition-colors">💾 Memorizza su questo dispositivo</button></div>

                    </div>

                    {mainTab !== 'PROSPETTI' && (

                            {mainTab === 'CANTIERE' && (

                                <div className={`${mainTab === 'PRE_COSTRUZIONE' ? 'bg-indigo-50 border-indigo-100' : 'bg-blue-50 border-blue-100'} p-3 sm:p-4 rounded-lg border shadow-sm flex flex-col justify-center`}>

                                    return (

                                            <div className="flex justify-between items-start mb-3 border-b border-gray-100 pb-2">
                                                <div className="flex-1 mr-2">
                                                    {editingId === item.id ? (
                                                        <input type="text" value={item.codice} onChange={(e) => handleItemChange(item.id, 'codice', e.target.value)} className="w-full border border-blue-300 rounded-lg p-2 focus:ring-2 focus:ring-blue-500 text-sm font-mono" placeholder="Codice" />
                                                    ) : (
                                                        <span className={`font-mono text-xs px-2 py-1 rounded font-semibold ${isExtra ? 'bg-orange-100 text-orange-800' : (isPre ? 'bg-indigo-100 text-indigo-800' : 'bg-gray-100 text-gray-700')}`}>{item.codice || 'Senza Codice'}</span>
                                                    )}
                                                </div>
                                                <div className="flex gap-2">
                                                    <button onClick={() => toggleEdit(item.id)} className={`p-2 rounded-lg ${editingId === item.id ? 'bg-green-100 text-green-700' : 'bg-gray-100 text-gray-600'}`}>{editingId === item.id ? <Icon name="save" size={18} /> : <Icon name="pencil" size={18} />}</button>
                                                    <button onClick={() => deleteItem(item.id)} className="p-2 bg-red-50 text-red-600 rounded-lg"><Icon name="trash" size={18} /></button>
                                                </div>
                                            </div>
                                            <div className="mb-3">
                                                {editingId === item.id ? ( <textarea value={item.descrizione} onChange={(e) => handleItemChange(item.id, 'descrizione', e.target.value)} className="w-full border border-blue-300 rounded-lg p-3 text-sm min-h-[100px]" placeholder="Descrizione..." />
                                                ) : ( <p className={`text-sm text-gray-800 cursor-pointer ${expandedDescIds.includes(item.id) ? '' : 'line-clamp-2'}`} onClick={() => toggleDescExpand(item.id)}>{item.descrizione || <span className="text-gray-400 italic">Nessuna descrizione</span>}</p> )}
                                            </div>
                                            <div className="grid grid-cols-2 gap-4 mb-3 bg-gray-50 p-2.5 rounded-lg border border-gray-100">
                                                <div>
                                                    <span className="text-[10px] uppercase text-gray-500 font-bold block mb-1">Previsto</span>
                                                    {editingId === item.id ? ( 
                                                        <TotalDraftInput committedValue={item.importoPrevisto} onCommit={(val) => handleItemChange(item.id, 'importoPrevisto', val)} className="w-full border border-blue-300 rounded-lg p-2 text-right text-sm" />
                                                    ) : ( <span className={`font-bold text-base ${isExtra ? 'text-orange-700' : (isPre ? 'text-indigo-700' : 'text-gray-800')}`}>{formatCurrency(previstoNum)}</span> )}
                                                </div>
                                                <div className="text-right">
                                                    <span className="text-[10px] uppercase text-gray-500 font-bold block mb-1">{activeSalView === "ALL" || isPre ? "Eseguito Tot." : `Eseguito SAL ${activeSalView}`}</span>
                                                    {activeSalView === "ALL" || isPre ? (
                                                        <TotalDraftInput committedValue={totalItemEseguito} onCommit={(val) => handleTotalChange(item.id, val)} className={`w-full border rounded-lg p-2 text-right text-sm font-bold ${isCompletato && !isExtra && !isPre ? 'border-green-400 bg-green-50 text-green-700' : 'border-blue-300 bg-white'}`} />
                                                    ) : (
                                                        <input type="number" step="0.01" value={item.eseguiti?.[activeSalView] ?? ''} onChange={(e) => handleSalChange(item.id, activeSalView, e.target.value)} className="w-full border rounded-lg p-2 text-right text-sm border-blue-300 bg-white" />
                                                    )}
                                                </div>
                                            </div>
                                            <div className="mb-3 px-1">
                                                <div className="flex justify-between items-center text-xs text-gray-500 mb-1.5">
                                                    <span>Avanzamento {((totalItemEseguito / previstoNum) * 100 || 0).toFixed(0)}%</span>
                                                    {editingId !== item.id && (<span className="font-semibold text-gray-700">Pagato da: {item.pagatoDa || '—'}</span>)}
                                                </div>
                                                <div className="w-full bg-gray-200 rounded-full h-2"><div className={`h-2 rounded-full ${isCompletato ? 'bg-green-500' : (isExtra ? 'bg-orange-500' : (isPre ? 'bg-indigo-500' : 'bg-blue-500'))}`} style={{ width: `${previstoNum > 0 ? Math.min((totalItemEseguito / previstoNum) * 100, 100) : 0}%` }}></div></div>
                                            </div>
                                            {editingId === item.id && (
                                                <div className="mb-3 px-1">
                                                    <span className="text-[10px] uppercase text-gray-500 font-bold block mb-1">Pagato da</span>
                                                    <select value={item.pagatoDa || ""} onChange={(e) => handleItemChange(item.id, 'pagatoDa', e.target.value)} className="w-full border border-blue-300 rounded-lg p-2 text-sm bg-white">
                                                        <option value="">-- Seleziona --</option><option value="Io">Io</option><option value="Silvia">Silvia</option>
                                                    </select>
                                                </div>
                                            )}
                                            <div><textarea rows={1} value={item.note} onChange={(e) => handleItemChange(item.id, 'note', e.target.value)} className="w-full border border-gray-200 rounded-lg p-2 text-sm bg-gray-50 focus:bg-white transition-colors" placeholder="Aggiungi una nota..." /></div>
                                        </div>
                                    );
                                })
                            ) : (<div className="bg-white p-8 text-center text-gray-500 rounded-xl border shadow-sm">Nessuna voce trovata in questa vista.</div>)}
                        </div>

                        {/* Vista Desktop (Tabella) */}
                        <div className="hidden lg:block overflow-x-auto bg-white sm:rounded-b-lg">
                        <table className={`w-full text-left border-collapse ${compactView ? 'table-compact' : ''}`} style={{ minWidth: '1000px' }}>
                            <thead>
                            <tr className="bg-gray-100 text-gray-700 text-sm border-b border-gray-300 select-none">
                                {renderSortableHeader("Codice", "codice", "w-32")}
                                <th className="px-4 py-3 font-semibold align-top" style={{ width: '40%' }}>Descrizione</th>
                                {renderSortableHeader("Importo Previsto", "importoPrevisto", "w-36 text-right")}
                                {renderSortableHeader((activeSalView === "ALL" || mainTab === 'PRE_COSTRUZIONE') ? "Eseguito Totale" : `Eseguito SAL ${activeSalView}`, "percentuale", "w-40 text-right")}
                                <th className="px-4 py-3 font-semibold w-28 align-top text-center" style={{ whiteSpace: 'nowrap' }}>Pagato da</th>
                                <th className="px-4 py-3 font-semibold align-top">Note</th>
                                <th className="px-4 py-3 font-semibold w-24 text-center align-top">Azioni</th>
                            </tr>
                            </thead>
                            <tbody className="divide-y divide-gray-200 text-sm">
                            {filteredItems.length > 0 ? (
                                filteredItems.map((item) => {
                                const previstoNum = parseFloat(item.importoPrevisto) || 0;
                                const totalItemEseguito = getItemTotalEseguito(item);
                                const isCompletato = totalItemEseguito >= previstoNum - 0.005 && previstoNum > 0;
                                const isExtra = isExtraItem(item.codice);
                                const isPre = isPreItem(item.codice);
                                
                                return (
                                    <tr key={item.id} className={`hover:bg-gray-50 transition-colors ${isExtra ? 'bg-orange-50/20' : (isPre ? 'bg-indigo-50/20' : (isCompletato ? 'bg-green-50/30' : ''))}`}>
                                    <td className="px-4 py-3 align-top">
                                        {editingId === item.id ? ( <input type="text" value={item.codice} onChange={(e) => handleItemChange(item.id, 'codice', e.target.value)} className="w-full border border-blue-300 rounded p-1.5 focus:ring-2 focus:ring-blue-500" />
                                        ) : ( <span className={`font-mono text-xs px-2 py-1 rounded ${isExtra ? 'bg-orange-100 text-orange-800' : (isPre ? 'bg-indigo-100 text-indigo-800' : 'bg-gray-100 text-gray-600')}`}>{item.codice || '-'}</span> )}
                                    </td>
                                    <td className="px-4 py-3 align-top">
                                        {editingId === item.id ? ( <textarea value={item.descrizione} onChange={(e) => handleItemChange(item.id, 'descrizione', e.target.value)} className="w-full border border-blue-300 rounded p-1.5 text-sm min-h-[60px]" placeholder="Descrizione..." />
                                        ) : ( <p className={`text-gray-800 cursor-pointer ${expandedDescIds.includes(item.id) ? '' : 'line-clamp-2'}`} onClick={() => toggleDescExpand(item.id)}>{item.descrizione || <span className="text-gray-400 italic">Nessuna descrizione</span>}</p> )}
                                    </td>
                                    <td className="px-4 py-3 align-top text-right" style={{ whiteSpace: 'nowrap' }}>
                                        {editingId === item.id ? ( 
                                            <TotalDraftInput committedValue={item.importoPrevisto} onCommit={(val) => handleItemChange(item.id, 'importoPrevisto', val)} className="w-full border border-blue-300 rounded p-1.5 text-right focus:outline-none" />
                                        ) : ( <span className={`font-medium ${isExtra ? 'text-orange-700' : (isPre ? 'text-indigo-700' : 'text-gray-700')}`}>{formatCurrency(previstoNum)}</span> )}
                                    </td>
                                    <td className="px-4 py-3 align-top text-right" style={{ whiteSpace: 'nowrap' }}>
                                        <div className="flex flex-col items-end gap-1">
                                            {activeSalView === "ALL" || isPre ? (
                                            <>
                                                <TotalDraftInput committedValue={totalItemEseguito} onCommit={(val) => handleTotalChange(item.id, val)} className={`w-full border rounded p-1.5 text-right font-bold ${isCompletato && !isExtra && !isPre ? 'border-green-400 bg-green-50 text-green-700' : 'border-gray-300'}`} />
                                                {!isExtra && !isPre && sals.length > 1 && (<span className="text-[10px] text-gray-500">Aggiorna l'ultimo SAL</span>)}
                                                {isExtra && (<span className="text-[10px] text-orange-500">Valore globale</span>)}
                                                {isPre && (<span className="text-[10px] text-indigo-500">Valore globale</span>)}
                                            </>
                                            ) : (
                                            <>
                                                <input type="number" step="0.01" value={item.eseguiti?.[activeSalView] ?? ''} onChange={(e) => handleSalChange(item.id, activeSalView, e.target.value)} className="w-full border rounded p-1.5 text-right border-blue-300" />
                                                <span className="text-[10px] text-gray-500">Tot: {formatCurrency(totalItemEseguito)}</span>
                                            </>
                                            )}
                                            <div className="w-full bg-gray-200 rounded-full h-1.5 mt-1" title={`${((totalItemEseguito / previstoNum) * 100 || 0).toFixed(0)}%`}><div className={`h-1.5 rounded-full ${isCompletato ? 'bg-green-500' : (isExtra ? 'bg-orange-500' : (isPre ? 'bg-indigo-500' : 'bg-blue-500'))}`} style={{ width: `${previstoNum > 0 ? Math.min((totalItemEseguito / previstoNum) * 100, 100) : 0}%` }}></div></div>
                                        </div>
                                    </td>
                                    <td className="px-4 py-3 align-top text-center">
                                        {editingId === item.id ? (
                                            <select value={item.pagatoDa || ""} onChange={(e) => handleItemChange(item.id, 'pagatoDa', e.target.value)} className="w-full border border-blue-300 rounded p-1.5 text-sm">
                                                <option value="">-- Nessuno --</option><option value="Io">Io</option><option value="Silvia">Silvia</option>
                                            </select>
                                        ) : ( <span className={`text-sm font-bold ${item.pagatoDa === 'Silvia' ? 'text-pink-600' : (item.pagatoDa === 'Io' ? 'text-blue-600' : 'text-gray-400')}`}>{item.pagatoDa || '-'}</span> )}
                                    </td>
                                    <td className="px-4 py-3 align-top">
                                        <textarea rows={1} value={item.note} onChange={(e) => handleItemChange(item.id, 'note', e.target.value)} className="w-full border border-gray-200 rounded p-1.5 text-xs bg-transparent resize-y" placeholder="Nota..." />
                                    </td>
                                    <td className="px-4 py-3 align-top text-center">
                                        <div className="flex justify-center gap-2">
                                        <button onClick={() => toggleEdit(item.id)} className={`p-1.5 rounded-md ${editingId === item.id ? 'bg-green-100 text-green-700' : 'bg-gray-100 text-gray-600 hover:bg-gray-200'}`}>{editingId === item.id ? <Icon name="save" size={16} /> : <Icon name="pencil" size={16} />}</button>
                                        <button onClick={() => deleteItem(item.id)} className="p-1.5 bg-red-50 text-red-600 rounded-md hover:bg-red-100"><Icon name="trash" size={16} /></button>
                                        </div>
                                    </td>
                                    </tr>
                                );
                                })
                            ) : (<tr><td colSpan="7" className="p-8 text-center text-gray-500 text-lg">Nessuna voce trovata in questa vista.</td></tr>)}
                            </tbody>
                            
                            <tfoot className="bg-gray-50 font-bold border-t-2 border-gray-300 text-gray-800">
                            {mainTab === 'CANTIERE' ? (
                                <>
                                    <tr>
                                        <td colSpan="2" className="p-3 pr-4 text-right uppercase text-xs tracking-wider text-gray-500">{activeSalView === "ALL" ? "Totale Progetto Base (Lordo)" : `Progetto Base SAL ${activeSalView} (Lordo)`}</td>
                                        <td className="p-3 text-right text-gray-600 font-semibold" style={{ whiteSpace: 'nowrap' }}>{formatCurrency(totals.previstoBase)}</td>
                                        <td className="p-3 text-right text-gray-600 font-semibold" style={{ whiteSpace: 'nowrap' }}>{formatCurrency(totals.eseguitoBase)}</td>
                                        <td colSpan="3" className="p-3"></td>
                                    </tr>
                                    <tr className="bg-red-50/50 border-t border-gray-200">
                                        <td colSpan="3" className="p-3 pr-4 text-right uppercase text-xs tracking-wider text-red-500 font-medium">Sconto Pattuito (7%) applicato al Lordo Base</td>
                                        <td className="p-3 pr-4 text-right text-red-600 font-medium" style={{ whiteSpace: 'nowrap' }}>- {formatCurrency(totals.scontoEseguito)}</td>
                                        <td colSpan="3" className="p-3"></td>
                                    </tr>
                                    <tr className="bg-gray-100 border-t border-gray-300 shadow-sm">
                                        <td colSpan="3" className="p-3 pr-4 text-right uppercase text-sm tracking-wider text-gray-800 font-extrabold">Netto Base</td>
                                        <td className="p-3 pr-4 text-right text-gray-900 font-extrabold text-base" style={{ whiteSpace: 'nowrap' }}>{formatCurrency(totals.nettoBase)}</td>
                                        <td colSpan="3" className="p-3"><div className="flex items-center gap-2 text-green-600 text-sm font-semibold"><Icon name="check-circle" size={18}/> {totals.percentuale}% {activeSalView === "ALL" ? "Avanzamento" : "Incidenza"}</div></td>
                                    </tr>
                                    {totals.recuperoAnticipo > 0 && (
                                        <tr className="bg-yellow-50 border-t border-yellow-200">
                                            <td colSpan="3" className="p-3 pr-4 text-right uppercase text-xs tracking-wider text-yellow-700 font-bold">Recupero Anticipo (Imponibile)</td>
                                            <td className="p-3 pr-4 text-right text-yellow-700 font-bold" style={{ whiteSpace: 'nowrap' }}>- {formatCurrency(totals.recuperoAnticipo)}</td>
                                            <td colSpan="3" className="p-3 text-xs text-yellow-600 font-normal">Sconto {activeSalView === "ALL" ? "SAL 1 + Ultimo SAL" : `applicato al SAL ${activeSalView}`}</td>
                                        </tr>
                                    )}
                                    <tr className="bg-gray-50 border-t border-gray-200">
                                        <td colSpan="3" className="p-3 pr-4 text-right uppercase text-xs tracking-wider text-gray-700 font-bold">Imponibile Soggetto a IVA</td>
                                        <td className="p-3 pr-4 text-right text-gray-800 font-bold" style={{ whiteSpace: 'nowrap' }}>{formatCurrency(totals.imponibileBase)}</td>
                                        <td colSpan="3" className="p-3"></td>
                                    </tr>
                                    <tr className="bg-blue-50/50 border-t border-blue-100">
                                        <td colSpan="3" className="p-3 pr-4 text-right uppercase text-xs tracking-wider text-blue-600 font-bold">IVA 10%</td>
                                        <td className="p-3 pr-4 text-right text-blue-600 font-bold" style={{ whiteSpace: 'nowrap' }}>+ {formatCurrency(totals.ivaBase)}</td>
                                        <td colSpan="3" className="p-3"></td>
                                    </tr>
                                    <tr className="bg-blue-100/50 border-t border-blue-200">
                                        <td colSpan="3" className="p-3 pr-4 text-right uppercase text-sm tracking-wider text-blue-800 font-bold">TOTALE SAL DA PAGARE (BASE IVATO)</td>
                                        <td className="p-3 pr-4 text-right text-blue-900 font-extrabold text-base" style={{ whiteSpace: 'nowrap' }}>{formatCurrency(totals.totaleIvatoBase)}</td>
                                        <td colSpan="3" className="p-3"></td>
                                    </tr>
                                    {(totals.previstoExtra > 0 || totals.eseguitoExtra > 0) && activeSalView === "ALL" && (
                                        <tr className="bg-orange-50/30 border-t border-gray-300">
                                            <td colSpan="2" className="p-3 pr-4 text-right uppercase text-xs tracking-wider text-orange-600 font-bold">Spese Extra (Fuori SAL, IVA Inclusa)</td>
                                            <td className="p-3 text-right text-orange-600 font-bold" style={{ whiteSpace: 'nowrap' }}>{formatCurrency(totals.previstoExtra)}</td>
                                            <td className="p-3 text-right text-orange-600 font-bold" style={{ whiteSpace: 'nowrap' }}>+ {formatCurrency(totals.eseguitoExtra)}</td>
                                            <td colSpan="3" className="p-3"></td>
                                        </tr>
                                    )}
                                    {(activeSalView === "ALL" || totals.eseguitoExtra > 0) && (
                                        <tr className="bg-blue-600 border-t-4 border-blue-800 text-white shadow-lg">
                                            <td colSpan="3" className="p-4 pr-4 text-right uppercase text-base tracking-wider font-extrabold">TOTALE FATTURA DA PAGARE</td>
                                            <td className="p-4 pr-4 text-right text-2xl font-extrabold" style={{ whiteSpace: 'nowrap' }}>{formatCurrency(totals.totaleGeneraleDaPagare)}</td>
                                            <td colSpan="3" className="p-4"></td>
                                        </tr>
                                    )}
                                </>
                            ) : (
                                <tr className="bg-indigo-50/80 border-t-2 border-indigo-200 shadow-sm">
                                    <td colSpan="2" className="p-4 pr-4 text-right uppercase text-sm tracking-wider text-indigo-800 font-extrabold">TOTALE SPESE PRELIMINARI E PROGETTAZIONE</td>
                                    <td className="p-4 pr-4 text-right text-indigo-800 font-extrabold" style={{ whiteSpace: 'nowrap' }}>{formatCurrency(totals.previstoPre)}</td>
                                    <td className="p-4 pr-4 text-right text-indigo-900 text-xl font-extrabold" style={{ whiteSpace: 'nowrap' }}>{formatCurrency(totals.eseguitoPre)}</td>
                                    <td colSpan="3" className="p-4"></td>
                                </tr>
                            )}
                            </tfoot>
                        </table>
                        </div>

                        {/* Riepilogo mobile sbloccato (scorre con la pagina) */}
                        <div className="block lg:hidden mt-6 bg-white border-t-4 border-blue-500 p-4 rounded-xl shadow-md mb-8">
                            {mainTab === 'CANTIERE' ? (
                                <>
                                    <h3 className="text-xs uppercase text-gray-500 font-bold mb-2">Riepilogo Fattura {activeSalView !== "ALL" && `(SAL ${activeSalView})`}</h3>
                                    <div className="flex justify-between items-center text-sm border-b border-gray-100 pb-1 mb-1"><span className="text-gray-600">Netto Base</span><span className="font-medium">{formatCurrency(totals.nettoBase)}</span></div>
                                    {totals.recuperoAnticipo > 0 && (
                                        <div className="flex justify-between items-center text-sm border-b border-gray-100 pb-1 mb-1 text-yellow-600"><span>Anticipo Scalato (Imponibile)</span><span>- {formatCurrency(totals.recuperoAnticipo)}</span></div>
                                    )}
                                    <div className="flex justify-between items-center text-sm border-b border-gray-100 pb-1 mb-1 text-gray-800 font-semibold bg-gray-50 px-1 rounded"><span>Imponibile</span><span>{formatCurrency(totals.imponibileBase)}</span></div>
                                    <div className="flex justify-between items-center text-sm border-b border-gray-100 pb-1 mb-1 text-blue-600"><span>IVA 10%</span><span className="font-medium">+ {formatCurrency(totals.ivaBase)}</span></div>
                                    <div className="flex justify-between items-center text-sm border-b border-gray-100 pb-1 mb-1 text-blue-800 font-bold bg-blue-50 px-1 rounded mt-1"><span>Totale Ivato Base</span><span>{formatCurrency(totals.totaleIvatoBase)}</span></div>
                                    {activeSalView === "ALL" && totals.eseguitoExtra > 0 && (<div className="flex justify-between items-center text-sm border-b border-gray-100 pb-1 mb-1 text-orange-600 mt-1"><span>Spese Extra (IVA Inc.)</span><span className="font-medium">+ {formatCurrency(totals.eseguitoExtra)}</span></div>)}
                                    <div className="flex justify-between items-center mt-2 pt-1"><span className="font-bold text-blue-700">TOTALE DA PAGARE</span><span className="font-bold text-2xl text-blue-700">{formatCurrency(totals.totaleGeneraleDaPagare)}</span></div>
                                </>
                            ) : (
                                <>
                                    <h3 className="text-xs uppercase text-gray-500 font-bold mb-2">Riepilogo Pre-Costruzione</h3>
                                    <div className="flex justify-between items-center text-sm border-b border-gray-100 pb-1 mb-1"><span className="text-gray-600">Preventivato</span><span className="font-medium">{formatCurrency(totals.previstoPre)}</span></div>
                                    <div className="flex justify-between items-center mt-2 pt-1"><span className="font-bold text-indigo-700">TOTALE ESEGUITO</span><span className="font-bold text-2xl text-indigo-700">{formatCurrency(totals.eseguitoPre)}</span></div>
                                </>
                            )}
                        </div>
                    </div>
                )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<SalDashboard />);
    </script>
</body>
</html>
