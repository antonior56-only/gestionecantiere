            { id: 36, codice: "SIC24_12.4.1.5", descrizione: "Fornitura e posa in opera di manto di copertura con tegole murate con malta bastarda (tipo Coppo siciliano).", importoPrevisto: 2077.92, note: "", isEditing: false },

            { id: 42, codice: "SIC24_26.1.3", descrizione: "Smontaggio ad opera ultimata di ponteggio di cui alla voce 26.1.1.", importoPrevisto: 599.78, note: "", isEditing: false },
            { id: 43, codice: "SIC24_26.1.26", descrizione: "Recinzione perimetrale di protezione in rete estrusa di polietilene ad alta densità HDPE.", importoPrevisto: 274.00, note: "", isEditing: false },

        function SalDashboard() {
            // Stato inizializzato dal LocalStorage per persistenza
            const [sals, setSals] = useState(() => {
                try {
                    const saved = localStorage.getItem('gestione-sal-sals');
                    if (saved) return JSON.parse(saved);
                } catch (e) { console.error("Errore lettura SAL da LocalStorage", e); }
                return [1];
            }); 
            
            const [items, setItems] = useState(() => {
                try {
                    const saved = localStorage.getItem('gestione-sal-items');
                    if (saved) {
                        return JSON.parse(saved);
                    }
                } catch (e) { console.error("Errore lettura Voci da LocalStorage", e); }
                return initialData.map(({ isEditing, ...item }) => ({ ...item, eseguiti: { 1: 0 } }));
            });

            // Stati per il salvataggio in Cloud
            const [cloudConfig, setCloudConfig] = useState(() => {
                try {
                    const saved = localStorage.getItem('sal-cloud-config');
                    if (saved) return JSON.parse(saved);
                } catch(e) {}
                return { binId: '', apiKey: '' };
            });
            const [showCloudSettings, setShowCloudSettings] = useState(false);
            const [isSyncing, setIsSyncing] = useState(false);

            const [editingId, setEditingId] = useState(null);
            const [activeSalView, setActiveSalView] = useState("ALL");
            const [searchCodice, setSearchCodice] = useState("");
            const [showOnlyExtra, setShowOnlyExtra] = useState(false);
            const [sortConfig, setSortConfig] = useState({ key: null, direction: 'asc' });
            
            const fileInputRef = useRef(null);
            // Ultimo snapshot salvato (stato, non ref: così l'indicatore di modifiche si aggiorna)
            const [lastSavedData, setLastSavedData] = useState(() => JSON.stringify(items));
            const hasUnsavedChanges = useMemo(() => JSON.stringify(items) !== lastSavedData, [items, lastSavedData]);

            const latestSal = useMemo(() => {
                return sals.length > 0 ? Math.max(...sals) : 1;
            }, [sals]);

            // Allarme di Chrome in caso di chiusura accidentale
            useEffect(() => {
                const beforeUnloadHandler = (e) => {
                    const currentDataString = JSON.stringify(items);
                    const needsBackup = currentDataString !== lastSavedData;
                    
                    if (needsBackup) {
                        e.preventDefault();
                        e.returnValue = "Hai modifiche non salvate! Sei sicuro di voler uscire perdendo i dati?";
                        return "Hai modifiche non salvate! Sei sicuro di voler uscire perdendo i dati?";
                    }
                };

                window.addEventListener('beforeunload', beforeUnloadHandler);
                return () => window.removeEventListener('beforeunload', beforeUnloadHandler);
            }, [items, lastSavedData]);

            // Salvataggio automatico in LocalStorage
            useEffect(() => {
                try {
                    localStorage.setItem('gestione-sal-sals', JSON.stringify(sals));
                } catch (e) { console.error("Errore salvataggio SAL", e); }
            }, [sals]);

            useEffect(() => {
                try {
                    localStorage.setItem('gestione-sal-items', JSON.stringify(items));
                } catch (e) { console.error("Errore salvataggio Voci", e); }
            }, [items]);

            // Salvataggio automatico e istantaneo delle chiavi Cloud
            useEffect(() => {
                try {
                    if (cloudConfig.binId !== '' || cloudConfig.apiKey !== '') {
                        localStorage.setItem('sal-cloud-config', JSON.stringify(cloudConfig));
                    } else {
                        // Entrambi i campi vuoti: rimuove le credenziali memorizzate
                        localStorage.removeItem('sal-cloud-config');
                    }
                } catch (e) { console.error("Errore salvataggio chiavi Cloud", e); }
            }, [cloudConfig]);

            // Sincronizzazione Automatica all'avvio
            useEffect(() => {
                if (cloudConfig.apiKey && cloudConfig.binId) {
                    loadFromCloud(true); // "true" significa che carica in modalità silenziosa senza fare pop-up
                }
            }, []); // Esegue solo al caricamento della pagina

            // FUNZIONI CLOUD
            const saveCloudSettings = () => {
                alert("Chiavi di accesso Cloud memorizzate in modo permanente sul dispositivo!\n\nUsa '⬇️ Scarica Dati' per recuperare i dati dal Cloud oppure '⬆️ Salva Ora' per inviare quelli presenti su questo dispositivo.");
            };

            const loadFromCloud = async (isSilent = false) => {
                if (!cloudConfig.apiKey || !cloudConfig.binId) {
                    if (!isSilent) alert("Inserisci Bin ID e Chiave di Accesso prima di sincronizzare!"); 
                    return;
                }
                setIsSyncing(true);
                try {
                    // Usa direttamente X-Master-Key che è la chiave fornita
                    const response = await fetch(`https://api.jsonbin.io/v3/b/${cloudConfig.binId}/latest`, {
                        headers: { 'X-Master-Key': cloudConfig.apiKey }
                    });
                    
                    if (!response.ok) throw new Error('Errore di connessione o chiavi errate');
                    
                    const result = await response.json();
                    const restoredData = result.record; // In JSONBin v3 i dati sono dentro "record"
                    
                    if (Array.isArray(restoredData)) {
                        let maxSalFound = 1;
                        const upgradedData = restoredData.map(item => {
                            let eseguiti = item.eseguiti || {};
                            Object.keys(eseguiti).forEach(k => {
                                if (k !== 'EXTRA' && Number(k) > maxSalFound) maxSalFound = Number(k);
                            });
                            const { isEditing, ...cleanItem } = item;
                            return { ...cleanItem, eseguiti };
                        });
                        
                        // Protezione anti-perdita dati: nella sincronizzazione automatica all'avvio,
                        // se i dati locali sono diversi da quelli sul Cloud, chiede conferma
                        // invece di sovrascrivere silenziosamente.
                        if (isSilent) {
                            const cloudString = JSON.stringify(upgradedData);
                            const localString = JSON.stringify(items);
                            if (cloudString !== localString) {
                                const usaCloud = window.confirm(
                                    "☁️ ATTENZIONE: su questo dispositivo sono presenti dati diversi da quelli salvati sul Cloud (probabilmente modifiche locali non ancora inviate).\n\n" +
                                    "• OK = scarica la versione Cloud (le modifiche locali andranno perse)\n" +
                                    "• Annulla = mantieni i dati di questo dispositivo (potrai inviarli al Cloud con 'Salva Ora' o 'Esci e Salva')"
                                );
                                if (!usaCloud) {
                                    return; // mantiene i dati locali
                                }
                            }
                        }

                        setSals(Array.from({length: maxSalFound}, (_, i) => i + 1));
                        setItems(upgradedData);
                        setActiveSalView("ALL");
                        setEditingId(null);
                        
                        setLastSavedData(JSON.stringify(upgradedData));
                        if (!isSilent) {
                            alert("Dati scaricati dal Cloud con successo!");
                            setShowCloudSettings(false);
                        }
                    }
                } catch (error) {
                    if (!isSilent) alert("Errore durante la lettura dal Cloud: " + error.message);
                    console.error("Auto-sync error", error);
                } finally {
                    setIsSyncing(false);
                }
            };

            const saveToCloud = async (dataToSave, isExit = false) => {
                if (!cloudConfig.apiKey || !cloudConfig.binId) {
                    alert("Configura prima il Cloud nelle impostazioni!");
                    setShowCloudSettings(true);
                    return;
                }
                setIsSyncing(true);
                try {
                    // Usa direttamente X-Master-Key per l'upload
                    const response = await fetch(`https://api.jsonbin.io/v3/b/${cloudConfig.binId}`, {
                        method: 'PUT',
                        headers: {
                            'Content-Type': 'application/json',
                            'X-Master-Key': cloudConfig.apiKey
                        },
                        body: JSON.stringify(dataToSave)
                    });
                    
                    if (!response.ok) throw new Error('Errore di comunicazione con JSONBin. Controlla le chiavi.');
                    
                    setLastSavedData(JSON.stringify(dataToSave));
                    
                    if (isExit) {
                        alert("✅ Salvataggio completato con successo!\n\nI dati sono al sicuro. Il programma ora chiuderà la pagina.\n\n(Nota: vedrai la schermata vuota del browser, è normale. Ora puoi semplicemente chiudere l'app o tornare alla Home del telefono).");
                        try { window.close(); } catch(e) {} 
                    } else {
                        alert('✅ Salvataggio in Cloud completato con successo!');
                    }
                } catch (error) {
                    alert("Errore durante il salvataggio in Cloud: " + error.message);
                } finally {
                    setIsSyncing(false);
                }
            };

            const handleSaveAndExit = async () => {
                const currentDataString = JSON.stringify(items);
                const needsBackup = currentDataString !== lastSavedData;
                
                if (needsBackup) {
                    // Se l'utente ha configurato il cloud, salva online
                    if (cloudConfig.apiKey && cloudConfig.binId) {
                        await saveToCloud(items, true);
                        return;
                    }
                    
                    // Fallback Classico locale
                    const now = new Date();
                    const gg = String(now.getDate()).padStart(2, '0');
                    const mm = String(now.getMonth() + 1).padStart(2, '0');
                    const aaaa = now.getFullYear();
                    const hh = String(now.getHours()).padStart(2, '0');
                    const min = String(now.getMinutes()).padStart(2, '0');
                    
                    const fileName = `gestionesal_${gg}-${mm}-${aaaa}_${hh}-${min}.json`;
                    const dataToSave = JSON.stringify(items, null, 2);

                    try {
                        if (window.showSaveFilePicker) {
                            const fileHandle = await window.showSaveFilePicker({
                                suggestedName: fileName,
                                types: [{ description: 'JSON File', accept: { 'application/json': ['.json'] } }],
                            });
                            const writable = await fileHandle.createWritable();
                            await writable.write(dataToSave);
                            await writable.close();
                        } else {
                            const blob = new Blob([dataToSave], { type: 'application/json' });
                            const url = URL.createObjectURL(blob);
                            const link = document.createElement('a');
                            link.href = url;
                            link.download = fileName;
                            document.body.appendChild(link);
                            link.click();
                            document.body.removeChild(link);
                            URL.revokeObjectURL(url);
                        }
                        
                        setLastSavedData(currentDataString);
                        alert("✅ Salvataggio locale completato!\n\nI dati sono stati scaricati. Il programma ora chiuderà la pagina.\n\n(Nota: vedrai la schermata vuota del browser, è normale. Ora puoi tornare alla Home del telefono).");
                        try { window.close(); } catch(e) {}
                    } catch (error) {
                        if (error.name !== 'AbortError') {
                            alert("Si è verificato un errore durante il salvataggio locale.");
                        }
                    }
                } else {
                    // Avviso esplicito se non ci sono modifiche da salvare
                    alert("ℹ️ Nessuna nuova modifica rilevata.\n\nI dati attuali sono già salvati e al sicuro. Il programma ora chiuderà la pagina.\n\n(Nota: vedrai la schermata vuota del browser, è normale).");
                    try { window.close(); } catch(e) {}
                }
            };

            const isExtraItem = (codice) => {
                return codice && String(codice).toUpperCase().startsWith('EXTRA');
            };

            const getItemTotalEseguito = (item) => {
                return Object.values(item.eseguiti || {}).reduce((sum, val) => sum + (parseFloat(val) || 0), 0);
            };

            const filteredItems = useMemo(() => {
                let result = [...items];
                
                if (activeSalView !== "ALL") {
                    result = result.filter(item => !isExtraItem(item.codice));
                } else if (showOnlyExtra) {
                    result = result.filter(item => isExtraItem(item.codice));
                }
                
                if (searchCodice.trim()) {
                    const searchLower = searchCodice.toLowerCase();
                    result = result.filter(item => 
                        (item.codice || "").toLowerCase().includes(searchLower) ||
                        (item.descrizione || "").toLowerCase().includes(searchLower)
                    );
                }

                if (sortConfig.key) {
                    result.sort((a, b) => {
                        if (sortConfig.key === 'codice') {
                            const codA = String(a.codice || "").toLowerCase();
                            const codB = String(b.codice || "").toLowerCase();
                            if (codA < codB) return sortConfig.direction === 'asc' ? -1 : 1;
                            if (codA > codB) return sortConfig.direction === 'asc' ? 1 : -1;
                            return 0;
                        }
                        if (sortConfig.key === 'importoPrevisto') {
                            const valA = parseFloat(a.importoPrevisto) || 0;
                            const valB = parseFloat(b.importoPrevisto) || 0;
                            return sortConfig.direction === 'asc' ? valA - valB : valB - valA;
                        }
                        if (sortConfig.key === 'percentuale') {
                            const getPerc = (item) => {
                                const prev = parseFloat(item.importoPrevisto) || 0;
                                if (prev === 0) return 0;
                                return (getItemTotalEseguito(item) / prev) * 100;
                            };
                            return sortConfig.direction === 'asc' ? getPerc(a) - getPerc(b) : getPerc(b) - getPerc(a);
                        }
                        if (sortConfig.key === 'realizzato') {
                            const getEseguito = (item) => activeSalView === "ALL" ? getItemTotalEseguito(item) : (parseFloat(item.eseguiti?.[activeSalView]) || 0);
                            const valA = getEseguito(a);
                            const valB = getEseguito(b);
                            return sortConfig.direction === 'asc' ? valA - valB : valB - valA;
                        }
                        if (sortConfig.key === 'daRealizzare') {
                            const getDaRealizzare = (item) => {
                                const prev = parseFloat(item.importoPrevisto) || 0;
                                const eseg = activeSalView === "ALL" ? getItemTotalEseguito(item) : (parseFloat(item.eseguiti?.[activeSalView]) || 0);
                                return prev - eseg;
                            };
                            const valA = getDaRealizzare(a);
                            const valB = getDaRealizzare(b);
                            return sortConfig.direction === 'asc' ? valA - valB : valB - valA;
                        }
                        return 0;
                    });
                }
                
                return result;
            }, [items, searchCodice, showOnlyExtra, sortConfig, activeSalView]);

            const handleItemChange = (id, field, value) => {
                setItems(items.map(item => {
                if (item.id === id) {
                    return { ...item, [field]: value };
                }
                return item;
                }));
            };

            const handleSalChange = (id, salId, value) => {
                setItems(items.map(item => {
                if (item.id === id) {
                    return {
                    ...item,
                    eseguiti: {
                        ...item.eseguiti,
                        [salId]: value 
                    }
                    };
                }
                return item;
                }));
            };

            const handleTotalChange = (id, value) => {
                // Campo lasciato vuoto: nessuna modifica (il valore precedente resta invariato)
                if (String(value).trim() === '') return;

                setItems(items.map(item => {
                if (item.id === id) {
                    let parsedValue = parseFloat(value) || 0;
                    
                    if (isExtraItem(item.codice)) {
                        return {
                            ...item,
                            eseguiti: { 'EXTRA': parsedValue.toString() }
                        };
                    }
                    
                    const previousSalsTotal = Object.entries(item.eseguiti || {}).reduce((sum, [key, val]) => {
                    return Number(key) === latestSal ? sum : sum + (parseFloat(val) || 0);
                    }, 0);

                    if (parsedValue < previousSalsTotal) {
                        alert(`Attenzione: l'importo totale inserito (${formatCurrency(parsedValue)}) è inferiore al totale dei SAL precedenti (${formatCurrency(previousSalsTotal)}). Operazione annullata per evitare perdita di dati storici.`);
                        return item;
                    }

                    return {
                    ...item,
                    eseguiti: {
                        ...item.eseguiti,
                        [latestSal]: (parsedValue - previousSalsTotal).toString()
                    }
                    };
                }
                return item;
                }));
            };

            const createNewSal = () => {
                const nextSalNumber = latestSal + 1;
                
                if (!window.confirm(`Sei sicuro di voler creare il SAL n° ${nextSalNumber}?`)) {
                    return;
                }

                setSals([...sals, nextSalNumber]);
                setActiveSalView(nextSalNumber);
                
                setItems(items.map(item => ({
                ...item,
                eseguiti: { ...item.eseguiti, [nextSalNumber]: 0 }
                })));
            };

            const deleteLastSal = () => {
                if (sals.length <= 1) {
                    alert("Non puoi eliminare l'unico SAL presente. Modifica i valori a zero se desideri svuotarlo.");
                    return;
                }
                
                const hasData = items.some(item => parseFloat(item.eseguiti?.[latestSal]) > 0);
                
                if (hasData) {
                    if (!window.confirm(`⚠️ ATTENZIONE: Il SAL n° ${latestSal} contiene importi inseriti.\n\nSei sicuro di volerlo eliminare? Tutti i dati di questo specifico SAL andranno persi definitivamente.`)) {
                        return;
                    }
                } else {
                    if (!window.confirm(`Sei sicuro di voler eliminare il SAL n° ${latestSal} (Vuoto)?`)) {
                        return;
                    }
                }
                
                const newSals = sals.filter(s => s !== latestSal);
                setSals(newSals);
                if (activeSalView === latestSal) {
                    setActiveSalView("ALL");
                }
                
                setItems(items.map(item => {
                    const newEseguiti = { ...item.eseguiti };
                    delete newEseguiti[latestSal];
                    return { ...item, eseguiti: newEseguiti };
                }));
            };

            const toggleEdit = (id) => {
                setEditingId(prev => prev === id ? null : id);
            };

            const deleteItem = (id) => {
                if(window.confirm("Sei sicuro di voler eliminare questa voce?")) {
                    setItems(items.filter(item => item.id !== id));
                    if (editingId === id) setEditingId(null);
                }
            };

            const addItem = () => {
                const newId = items.length > 0 ? Math.max(...items.map(i => i.id)) + 1 : 1;
                setItems([...items, {
                    id: newId,
                    codice: "",
                    descrizione: "Nuova lavorazione...",
                    importoPrevisto: 0,
                    note: "",
                    eseguiti: sals.reduce((acc, sal) => ({ ...acc, [sal]: 0 }), {})
                }]);
                setSearchCodice(""); 
                setShowOnlyExtra(false); 
                setEditingId(newId);
                
                setTimeout(() => {
                    window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
                }, 100);
            };

            const addExtraItem = () => {
                const newId = items.length > 0 ? Math.max(...items.map(i => i.id)) + 1 : 1;
                
                const extraItems = items.filter(i => isExtraItem(i.codice));
                let maxExtraNum = 0;
                extraItems.forEach(i => {
                    const numPart = parseInt(i.codice.split('-')[1]);
                    if (!isNaN(numPart) && numPart > maxExtraNum) {
                        maxExtraNum = numPart;
                    }
                });
                const nextExtraNum = maxExtraNum + 1;
                const generatedCodice = `EXTRA-${String(nextExtraNum).padStart(3, '0')}`;

                setItems([...items, {
                    id: newId,
                    codice: generatedCodice,
                    descrizione: "Nuova spesa extra...",
                    importoPrevisto: 0,
                    note: "",
                    eseguiti: { 'EXTRA': 0 }
                }]);
                setSearchCodice(""); 
                setShowOnlyExtra(true); 
                setActiveSalView("ALL"); 
                setEditingId(newId);
                
                setTimeout(() => {
                    window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
                }, 100);
            };

            const handleBackup = () => {
                const dataToSave = JSON.stringify(items, null, 2);
                const blob = new Blob([dataToSave], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = `backup_sal_cantiere_${new Date().toISOString().split('T')[0]}.json`;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                URL.revokeObjectURL(url);
                
                setLastSavedData(JSON.stringify(items));
            };

            const handleRestore = (event) => {
                const file = event.target.files[0];
                if (file) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                    const restoredData = JSON.parse(e.target.result);
                    if (Array.isArray(restoredData)) {
                        let maxSalFound = 1;
                        const upgradedData = restoredData.map(item => {
                        let eseguiti = item.eseguiti || {};
                        if (!item.eseguiti && item.importoEseguito !== undefined) {
                            eseguiti = { 1: item.importoEseguito };
                        }
                        Object.keys(eseguiti).forEach(k => {
                            if (k !== 'EXTRA' && Number(k) > maxSalFound) maxSalFound = Number(k);
                        });
                        const { isEditing, ...cleanItem } = item;
                        return { ...cleanItem, eseguiti };
                        });
                        
                        setSals(Array.from({length: maxSalFound}, (_, i) => i + 1));
                        setItems(upgradedData);
                        setActiveSalView("ALL");
                        setEditingId(null);
                        
                        setLastSavedData(JSON.stringify(upgradedData));
                        
                        alert("Dati ripristinati con successo!");
                    }
                    } catch (error) {
                    alert("Errore durante la lettura del file.");
                    }
                };
                reader.readAsText(file);
                }
                if (fileInputRef.current) fileInputRef.current.value = '';
            };

            const totals = useMemo(() => {
                const previstoBase = items.filter(i => !isExtraItem(i.codice)).reduce((sum, item) => sum + (parseFloat(item.importoPrevisto) || 0), 0);
                const previstoExtra = items.filter(i => isExtraItem(i.codice)).reduce((sum, item) => sum + (parseFloat(item.importoPrevisto) || 0), 0);
                const previstoComplessivo = previstoBase + previstoExtra;
                
                let eseguitoBase = 0;
                let eseguitoExtra = 0;

                if (activeSalView === "ALL") {
                    eseguitoBase = items.filter(i => !isExtraItem(i.codice)).reduce((sum, item) => sum + getItemTotalEseguito(item), 0);
                    eseguitoExtra = items.filter(i => isExtraItem(i.codice)).reduce((sum, item) => sum + getItemTotalEseguito(item), 0);
                } else {
                    eseguitoBase = items.filter(i => !isExtraItem(i.codice)).reduce((sum, item) => sum + (parseFloat(item.eseguiti?.[activeSalView]) || 0), 0);
                    eseguitoExtra = 0; 
                }

                const eseguitoTotale = eseguitoBase + eseguitoExtra;
                
                const scontoEseguito = eseguitoBase * 0.07;
                const eseguitoNetto = (eseguitoBase - scontoEseguito) + eseguitoExtra;

                const percentualeReale = previstoBase > 0 ? ((eseguitoBase / previstoBase) * 100) : 0;

                            filteredItems.map((item) => {
                            const previstoNum = parseFloat(item.importoPrevisto) || 0;
                            const totalItemEseguito = getItemTotalEseguito(item);
                            const isCompletato = totalItemEseguito >= previstoNum - 0.005 && previstoNum > 0; // tolleranza per errori di arrotondamento
                            const isExtra = isExtraItem(item.codice);
                            
                            return (
                                <tr key={item.id} className={`hover:bg-gray-50 transition-colors ${isExtra ? 'bg-orange-50/20' : (isCompletato ? 'bg-green-50/30' : '')}`}>
                                
                                <td className="p-4 align-top">
                                    {editingId === item.id ? (
                                    <input type="text" value={item.codice} onChange={(e) => handleItemChange(item.id, 'codice', e.target.value)} className="w-full border border-blue-300 rounded p-1.5 focus:outline-none focus:ring-2 focus:ring-blue-500" />
                                    ) : (
                                    <span className={`font-mono text-xs px-2 py-1 rounded ${isExtra ? 'bg-orange-100 text-orange-800' : 'bg-gray-100 text-gray-600'}`}>{item.codice || '-'}</span>
                                    )}
                                </td>

                                <td className="p-4 align-top">
                                    {editingId === item.id ? (
                                    <textarea value={item.descrizione} onChange={(e) => handleItemChange(item.id, 'descrizione', e.target.value)} className="w-full border border-blue-300 rounded p-1.5 text-sm focus:outline-none min-h-[60px]" />
                                    ) : (
                                    <p className="text-gray-800 line-clamp-3" title={item.descrizione}>{item.descrizione}</p>
                                    )}
                                </td>

                                <td className="p-4 align-top text-right">
                                    {editingId === item.id ? (
                                    <input type="number" step="0.01" value={item.importoPrevisto ?? ''} onChange={(e) => handleItemChange(item.id, 'importoPrevisto', e.target.value)} className="w-full border border-blue-300 rounded p-1.5 text-right focus:outline-none" />
                                    ) : (
                                    <span className={`font-medium ${isExtra ? 'text-orange-700' : 'text-gray-700'}`}>{formatCurrency(previstoNum)}</span>
                                    )}
                                </td>

                                <td className="p-4 align-top text-right">
                                    <div className="flex flex-col items-end gap-1">
                                        {activeSalView === "ALL" ? (
                                        <>
                                            <TotalDraftInput
                                            committedValue={totalItemEseguito}
                                            onCommit={(val) => handleTotalChange(item.id, val)}
                                            className={`w-full border rounded p-1.5 text-right font-bold focus:outline-none focus:ring-2 ${isCompletato && !isExtra ? 'border-green-400 bg-green-50 text-green-700 focus:ring-green-500' : (isExtra ? 'border-orange-300 text-orange-700 focus:ring-orange-500' : 'border-blue-300 focus:ring-blue-500 text-blue-700')}`}
                                            />
                                            {!isExtra && sals.length > 1 && (
                                            <span className="text-[10px] text-gray-500 whitespace-nowrap">
                                                Aggiorna l'ultimo SAL
                                            </span>
                                            )}
                                            {isExtra && (
                                            <span className="text-[10px] text-orange-500 whitespace-nowrap">
                                                Valore globale (Fuori SAL)
                                            </span>
                                            )}
                                        </>
                                        ) : (
                                        <>
                                            <input 
                                            type="number" 
                                            step="0.01"
                                            value={item.eseguiti?.[activeSalView] ?? ''} 
                                            onChange={(e) => handleSalChange(item.id, activeSalView, e.target.value)}
                                            className={`w-full border rounded p-1.5 text-right focus:outline-none focus:ring-2 ${isExtra ? 'border-orange-300 focus:ring-orange-500' : 'border-blue-300 focus:ring-blue-500'}`}
                                            placeholder="0.00"
                                            />
                                            <span className="text-[10px] text-gray-500 whitespace-nowrap">
                                            Totale attuale: {formatCurrency(totalItemEseguito)}
                                            </span>
                                        </>
                                        )}
                                        
                                        <div className="w-full bg-gray-200 rounded-full h-1.5 mt-1" title={`${((totalItemEseguito / previstoNum) * 100 || 0).toFixed(0)}%`}>
                                        <div className={`h-1.5 rounded-full ${isCompletato ? 'bg-green-500' : (isExtra ? 'bg-orange-500' : 'bg-blue-500')}`} style={{ width: `${previstoNum > 0 ? Math.min((totalItemEseguito / previstoNum) * 100, 100) : 0}%` }}></div>
                                        </div>
                                    </div>
                                </td>

                                <td className="p-4 align-top">
                                    <textarea value={item.note} onChange={(e) => handleItemChange(item.id, 'note', e.target.value)} className="w-full border border-gray-200 rounded p-1.5 text-sm text-gray-600 focus:outline-none focus:border-blue-400 bg-transparent resize-y min-h-[40px]" placeholder="Aggiungi nota..." />
                                </td>

                                <td className="p-4 align-top text-center">
                                    <div className="flex justify-center items-center gap-2">
                                    <button onClick={() => toggleEdit(item.id)} className={`p-1.5 rounded-md transition-colors ${editingId === item.id ? 'bg-green-100 text-green-700 hover:bg-green-200' : 'bg-gray-100 text-gray-600 hover:bg-gray-200 hover:text-blue-600'}`}>
                                        {editingId === item.id ? <Icon name="save" size={16} /> : <Icon name="pencil" size={16} />}
                                    </button>
                                    <button onClick={() => deleteItem(item.id)} className="p-1.5 bg-red-50 text-red-600 rounded-md hover:bg-red-100 transition-colors">
                                        <Icon name="trash" size={16} />
                                    </button>
                                    </div>
                                </td>
                                </tr>
                            );
                            })
                        ) : (
                            <tr>
                            <td colSpan="6" className="p-8 text-center text-gray-500">
                                Nessuna voce trovata.
                            </td>
                            </tr>
                        )}
                        </tbody>
                        
                        <tfoot className="bg-gray-50 font-bold border-t-2 border-gray-200 text-gray-800">
                        {/* Riga Progetto Base Lordo */}
                        <tr>
                            <td colSpan="2" className="p-2 pr-4 text-right uppercase text-xs tracking-wider text-gray-500">
                            {activeSalView === "ALL" ? "Totale Progetto Base (Lordo)" : `Progetto Base SAL ${activeSalView} (Lordo)`}
                            </td>
                            <td className="p-2 text-right text-gray-600 font-semibold">{formatCurrency(totals.previstoBase)}</td>
                            <td className="p-2 text-right text-gray-600 font-semibold">{formatCurrency(totals.eseguitoBase)}</td>
                            <td colSpan="2" className="p-2"></td>
                        </tr>

                        {/* Riga Sconto 7% (Applicato SOLO su Base) */}
                        <tr className="bg-red-50/50 border-t border-gray-100">
                            <td colSpan="3" className="p-2 pr-4 text-right uppercase text-xs tracking-wider text-red-500 font-medium">
                            Sconto Pattuito (7%) applicato solo al Progetto Base
                            </td>
                            <td className="p-2 pr-4 text-right text-red-600 font-medium">
                            - {formatCurrency(totals.scontoEseguito)}
                            </td>
                            <td colSpan="2" className="p-2"></td>
                        </tr>

                        {/* Riga Netto Progetto Base (Intermedio) */}
                        <tr className="bg-gray-100 border-t border-gray-200">
                            <td colSpan="3" className="p-2 pr-4 text-right uppercase text-xs tracking-wider text-gray-700 font-bold">
                            Totale Netto Progetto Base
                            </td>
                            <td className="p-2 pr-4 text-right text-gray-800 font-bold">
                            {formatCurrency(totals.eseguitoBase - totals.scontoEseguito)}
                            </td>
                            <td colSpan="2" className="p-2">
                            <div className="flex items-center gap-2 text-green-600 text-sm font-normal">
                                <Icon name="check-circle" size={18}/> {totals.percentuale}% {activeSalView === "ALL" ? "Avanzamento Base" : "Incidenza Base"}
                            </div>
                            </td>
                        </tr>

                        {/* Riga Spese Extra (visibile solo nel Riepilogo Generale o se ci sono extra valorizzati) */}
                        {(totals.previstoExtra > 0 || totals.eseguitoExtra > 0) && activeSalView === "ALL" && (
                            <tr className="bg-orange-50/30 border-t border-gray-200">
                                <td colSpan="2" className="p-2 pr-4 text-right uppercase text-xs tracking-wider text-orange-600 font-bold">
                                Spese Extra (Fuori SAL, non soggette a sconto)
                                </td>
                                <td className="p-2 text-right text-orange-600 font-bold">{formatCurrency(totals.previstoExtra)}</td>
                                <td className="p-2 text-right text-orange-600 font-bold">+ {formatCurrency(totals.eseguitoExtra)}</td>
                                <td colSpan="2" className="p-2"></td>
                            </tr>
                        )}

                        {/* Riga Netto Finale da Pagare (Base Netto + Extra) */}
                        <tr className="bg-blue-50/80 border-t-2 border-blue-200">
                            <td colSpan="3" className="p-3 pr-4 text-right uppercase text-sm tracking-wider text-blue-800 font-extrabold">
                            TOTALE GENERALE DA PAGARE (NETTO BASE + EXTRA)
                            </td>
                            <td className="p-3 pr-4 text-right text-blue-800 text-lg font-extrabold">
                            {formatCurrency(totals.eseguitoNetto)}
                            </td>
                            <td colSpan="2" className="p-3"></td>
                        </tr>
                        </tfoot>
                    </table>
                    </div>

                    {/* Totali Fissi a fondo pagina SOLO per MOBILE */}
                    <div className="block lg:hidden mt-6 bg-white border-t-4 border-blue-500 p-4 rounded-t-xl shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.1)] sticky bottom-0 z-10">
                        <h3 className="text-xs uppercase text-gray-500 font-bold mb-2">Riepilogo Finale da Pagare</h3>
                        
                        <div className="flex justify-between items-center text-sm border-b border-gray-100 pb-1 mb-1">
                            <span className="text-gray-600">Lordo Base {activeSalView !== "ALL" && `(SAL ${activeSalView})`}</span>
                            <span className="font-medium">{formatCurrency(totals.eseguitoBase)}</span>
                        </div>
                        
                        <div className="flex justify-between items-center text-sm border-b border-gray-100 pb-1 mb-1 text-red-500">
                            <span>Sconto 7% (su Base)</span>
                            <span>- {formatCurrency(totals.scontoEseguito)}</span>
                        </div>

                        <div className="flex justify-between items-center text-sm border-b border-gray-100 pb-1 mb-1 text-gray-800 font-semibold bg-gray-50 px-1 rounded">
                            <span>Netto Base</span>
                            <span>{formatCurrency(totals.eseguitoBase - totals.scontoEseguito)}</span>
                        </div>

                        {activeSalView === "ALL" && totals.eseguitoExtra > 0 && (
                            <div className="flex justify-between items-center text-sm border-b border-gray-100 pb-1 mb-1 text-orange-600 mt-1">
                                <span>Spese Extra (Fuori SAL)</span>
                                <span className="font-medium">+ {formatCurrency(totals.eseguitoExtra)}</span>
                            </div>
                        )}
                        
                        <div className="flex justify-between items-center mt-2 pt-1">
                            <span className="font-bold text-blue-700">NETTO FINALE</span>
                            <span className="font-bold text-xl text-blue-700">{formatCurrency(totals.eseguitoNetto)}</span>
                        </div>
                    </div>

                </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<SalDashboard />);
    </script>
</body>
</html>
